{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="ar" class="">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التحقق من الدخول - منصة آية</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: "#386641", light: "#6A994E", dark: "#A7C957" },
                        secondary: "#6A994E",
                        background: { DEFAULT: "#F7F9FC", dark: "#111827" },
                        card: { DEFAULT: "#FFFFFF", dark: "#1F2937" },
                        "text-primary": { DEFAULT: "#212529", dark: "#F9FAFB" },
                        "text-secondary": { DEFAULT: "#6C757D", dark: "#9CA3AF" },
                        border: { DEFAULT: "#E5E7EB", dark: "#374151" },
                        error: "#e63946",
                        success: "#A7C957",
                    },
                    fontFamily: { display: ["Cairo", "sans-serif"] },
                },
            },
        };
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .form-input-group { position: relative; }
        .form-input-group label {
            position: absolute; top: 50%; right: 1rem; transform: translateY(-50%);
            background: #FFFFFF; padding: 0 .25rem; color: #6C757D; font-size: 1rem;
            transition: all .2s ease-in-out; pointer-events: none;
        }
        .dark .form-input-group label { background: #1F2937; color: #9CA3AF; }
        .form-input:focus~label, .form-input:not(:placeholder-shown)~label {
            top: 0; font-size: .875rem; color: #386641;
        }
        .dark .form-input:focus~label { color: #A7C957; }
    </style>
</head>

<body class="bg-background dark:bg-background-dark font-display text-text-primary dark:text-text-primary-dark antialiased flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-card dark:bg-card-dark rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
            <div class="inline-flex bg-primary/10 p-3 rounded-full mb-4">
                <span class="material-symbols-outlined text-primary text-4xl">lock_open</span>
            </div>
            <h1 class="text-2xl font-bold mb-2">التحقق من الهوية</h1>
            <p class="text-text-secondary dark:text-text-secondary-dark text-sm">
                تم إرسال رمز التحقق إلى بريدك الإلكتروني: <br>
                <span class="font-semibold text-primary" dir="ltr">{{ email }}</span>
            </p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="form-input-group">
                <input id="code" name="code" type="text" placeholder=" " required maxlength="6" pattern="\d{6}"
                    class="form-input w-full p-4 rounded-lg bg-background dark:bg-background-dark border-2 border-border dark:border-border-dark focus:outline-none focus:ring-0 focus:border-primary text-center text-2xl tracking-widest font-mono" />
                <label for="code" class="right-1/2 translate-x-1/2">رمز التحقق (6 أرقام)</label>
            </div>

            {% if messages %}
            <div class="space-y-2 text-center">
                {% for message in messages %}
                <p class="text-sm {% if message.tags == 'error' %}text-error{% else %}text-primary{% endif %}">
                    {{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <button type="submit"
                class="w-full bg-primary text-white font-bold py-3 px-8 rounded-lg hover:bg-primary-light transition-colors text-lg">
                تأكيد الدخول
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-text-secondary dark:text-text-secondary-dark">
                لم يصلك الرمز؟ 
                <a href="{% url 'accounts:login' %}" class="font-bold text-primary hover:underline">العودة لتسجيل الدخول</a>
            </p>
        </div>
    </div>

</body>
</html>
