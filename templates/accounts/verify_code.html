{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="ar" class="">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التحقق وإعادة التعيين - منصة آية</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: "#386641", light: "#6A994E", dark: "#A7C957" },
                        secondary: "#6A994E",
                        background: { DEFAULT: "#F7F9FC", dark: "#111827" },
                        card: { DEFAULT: "#FFFFFF", dark: "#1F2937" },
                        "text-primary": { DEFAULT: "#212529", dark: "#F9FAFB" },
                        "text-secondary": { DEFAULT: "#6C757D", dark: "#9CA3AF" },
                        border: { DEFAULT: "#E5E7EB", dark: "#374151" },
                        error: "#e63946",
                        success: "#A7C957",
                    },
                    fontFamily: { display: ["Cairo", "sans-serif"] },
                    borderRadius: { xl: "1rem", lg: "0.75rem" },
                    boxShadow: {
                        subtle: "0 4px 12px 0 rgba(0,0,0,.05)",
                        lifted: "0 10px 30px 0 rgba(0,0,0,.07)",
                    },
                    animation: {
                        'fade-in': 'fade-in 0.5s ease-out forwards',
                        'fade-out': 'fade-out 0.5s ease-in forwards'
                    },
                    keyframes: {
                        'fade-in': { from: { opacity: 0 }, to: { opacity: 1 } },
                        'fade-out': { from: { opacity: 1 }, to: { opacity: 0 } }
                    }
                },
            },
        };
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .form-input-group {
            position: relative;
        }

        .form-input-group label {
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            background: #FFFFFF;
            padding: 0 .25rem;
            color: #6C757D;
            font-size: 1rem;
            transition: all .2s ease-in-out;
            pointer-events: none;
        }

        .dark .form-input-group label {
            background: #1F2937;
            color: #9CA3AF;
        }

        .form-input:focus~label,
        .form-input:not(:placeholder-shown)~label {
            top: 0;
            font-size: .875rem;
            color: #386641;
        }

        .dark .form-input:focus~label {
            color: #A7C957;
        }
    </style>
</head>

<body
    class="bg-background dark:bg-background-dark font-display text-text-primary dark:text-text-primary-dark antialiased">

    <button id="theme-toggle"
        class="absolute top-6 left-6 z-50 rounded-full p-2.5 bg-card dark:bg-card-dark shadow-subtle hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
        title="تغيير المظهر">
        <span class="material-symbols-outlined text-text-secondary dark:text-text-secondary-dark"
            id="theme-icon"></span>
    </button>

    <div class="flex min-h-screen">
        <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-6 sm:p-12">
            <div class="w-full max-w-md my-auto">
                <div class="text-center mb-8">
                    <a href="{% url 'accounts:login' %}" class="inline-block mb-4">
                        <div
                            class="bg-card dark:bg-card-dark p-2 rounded-2xl flex items-center justify-center shadow-subtle">
                            <img src="{% static 'img/logo.png' %}" alt="شعار منصة آية" class="w-14 h-14">
                        </div>
                    </a>
                    <h1 class="text-3xl font-extrabold">التحقق وإعادة التعيين</h1>
                    <p class="text-text-secondary dark:text-text-secondary-dark mt-2">
                        أدخل الرمز وكلمة المرور الجديدة.
                    </p>
                </div>

                <form method="POST" class="space-y-6">
                    {% csrf_token %}

                    <div class="form-input-group">
                        <input id="otp_code" name="otp_code" type="text" placeholder=" " required maxlength="6"
                            class="form-input w-full p-4 rounded-lg bg-card dark:bg-card-dark border-2 border-border dark:border-border-dark focus:outline-none focus:ring-0 focus:border-primary placeholder-transparent text-lg tracking-widest text-center" />
                        <label for="otp_code">رمز التحقق (OTP)</label>
                    </div>

                    <div class="form-input-group">
                        <input id="new_password" name="new_password" type="password" placeholder=" " required
                            class="form-input w-full p-4 rounded-lg bg-card dark:bg-card-dark border-2 border-border dark:border-border-dark focus:outline-none focus:ring-0 focus:border-primary placeholder-transparent text-lg" />
                        <label for="new_password">كلمة المرور الجديدة</label>
                    </div>

                    <div class="form-input-group">
                        <input id="confirm_password" name="confirm_password" type="password" placeholder=" " required
                            class="form-input w-full p-4 rounded-lg bg-card dark:bg-card-dark border-2 border-border dark:border-border-dark focus:outline-none focus:ring-0 focus:border-primary placeholder-transparent text-lg" />
                        <label for="confirm_password">تأكيد كلمة المرور</label>
                    </div>

                    {% if messages %}
                    <div class="space-y-2 text-center">
                        {% for message in messages %}
                        <p class="text-sm {% if message.tags == 'error' %}text-error{% else %}text-primary{% endif %}">
                            {{ message }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <button type="submit"
                        class="w-full bg-primary text-white font-bold py-3 px-8 rounded-lg hover:bg-primary-light transition-colors text-lg flex items-center justify-center gap-2">
                        <span>تغيير كلمة المرور</span>
                        <span class="material-symbols-outlined text-sm">check_circle</span>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-sm text-text-secondary dark:text-text-secondary-dark">
                        لم يصلك الرمز؟ <a href="{% url 'accounts:forgot_password' %}"
                            class="font-bold text-primary hover:underline">إعادة الإرسال</a>
                    </p>
                </div>
            </div>
        </div>

        <div
            class="hidden lg:flex w-1/2 bg-gradient-to-tr from-primary/5 to-secondary/10 dark:from-primary/10 dark:to-secondary/20 items-center justify-center p-12 relative overflow-hidden">
            <div class="absolute inset-0 opacity-20"
                style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23386641\' fill-opacity=\'0.2\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');">
            </div>
            <div class="text-center z-10 space-y-4">
                <h2 id="dynamic-title"
                    class="text-4xl font-black text-primary dark:text-success leading-tight transition-opacity duration-500 opacity-0">
                </h2>
                <div id="typewriter-container" class="typewriter-container h-16">
                    <p id="typewriter-text"
                        class="text-2xl text-text-secondary dark:text-text-secondary-dark max-w-md mx-auto transition-opacity duration-500 opacity-0">
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- Theme Toggle Logic ---
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');

            const applyTheme = (theme) => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    if (themeIcon) themeIcon.textContent = 'light_mode';
                } else {
                    document.documentElement.classList.remove('dark');
                    if (themeIcon) themeIcon.textContent = 'dark_mode';
                }
            };
            const savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);
            themeToggle?.addEventListener('click', () => {
                const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });

            // --- Dynamic Typewriter Logic ---
            const dynamicTitle = document.getElementById('dynamic-title');
            const typewriterText = document.getElementById('typewriter-text');
            let typewriterTimeout;
            const inspirationalContent = [
                { title: "أمانك أولويتنا", quote: "نحرص على حماية بياناتك وخصوصيتك." },
                { title: "خطوة أخيرة", quote: "قم بتعيين كلمة مرور قوية لحماية حسابك." },
                { title: "دائماً معك", quote: "فريق الدعم جاهز لمساعدتك في أي وقت." }
            ];
            let contentIndex = 0;

            function runTypewriter() {
                if (!dynamicTitle || !typewriterText) return;
                clearTimeout(typewriterTimeout);
                const content = inspirationalContent[contentIndex];

                dynamicTitle.classList.add('opacity-0');
                typewriterText.classList.add('opacity-0');

                setTimeout(() => {
                    dynamicTitle.textContent = content.title;
                    typewriterText.textContent = '';
                    dynamicTitle.classList.remove('opacity-0');
                    typewriterText.classList.remove('opacity-0');

                    let i = 0;
                    const typingInterval = setInterval(() => {
                        if (i < content.quote.length) {
                            typewriterText.textContent += content.quote.charAt(i);
                            i++;
                        } else {
                            clearInterval(typingInterval);
                            typewriterTimeout = setTimeout(() => {
                                contentIndex = (contentIndex + 1) % inspirationalContent.length;
                                runTypewriter();
                            }, 5000);
                        }
                    }, 60);
                }, 500);
            }

            runTypewriter();
        });
    </script>
</body>

</html>
